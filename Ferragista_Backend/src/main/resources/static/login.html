<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ferragista & Materiais de Construção</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1.5rem;
    }

    .login-container {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.25), 0 8px 10px -6px rgb(0 0 0 / 0.25);
      padding: 2.5rem 2rem;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: #e0f2fe;
      color: #0284c7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .quick-creds {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 1.5rem;
      font-size: 0.825rem;
      color: #475569;
    }

    .quick-creds-title {
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-cred {
      background: #e2e8f0;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 0.25rem;
      transition: background 0.2s;
    }

    .btn-cred:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-icon">🔧</div>
      <h1 class="login-title">Ferragista & Vendas</h1>
      <p class="login-subtitle">Acesso ao Sistema de Gestão e Vendas</p>
    </div>

    <div id="loginAlert" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Usuário ou E-mail</label>
        <input type="text" id="username" class="form-control" placeholder="Digite seu usuário ou e-mail" required autofocus autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="password">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem;">
        Entrar no Sistema
      </button>
    </form>

    <div class="quick-creds">
      <div class="quick-creds-title">⚡ Credenciais para Avaliação:</div>
      <div>
        <button type="button" class="btn-cred" onclick="preencherCredenciais('admin', 'admin123')">
          👤 Administrador: <strong>admin</strong> / <strong>admin123</strong>
        </button>
      </div>
      <div>
        <button type="button" class="btn-cred" onclick="preencherCredenciais('vendedor', 'vendedor123')">
          🛒 Vendedor: <strong>vendedor</strong> / <strong>vendedor123</strong>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function preencherCredenciais(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('btnLogin');
      const alertDiv = document.getElementById('loginAlert');
      const username = document.getElementById('username').value.trim();
      const senha = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.innerText = 'Autenticando...';
      alertDiv.style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: username, senha: senha })
        });

        const data = await response.json();

        if (response.ok) {
          alertDiv.className = 'alert alert-success';
          alertDiv.innerHTML = '<strong>Sucesso!</strong> Autenticado com sucesso. Redirecionando...';
          alertDiv.style.display = 'block';

          // Salva autenticação
          Auth.salvarSessao(data);

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 800);
        } else {
          alertDiv.className = 'alert alert-danger';
          alertDiv.innerHTML = `<strong>Erro ao autenticar:</strong> ${data.message || 'Usuário ou senha incorretos'}`;
          alertDiv.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerText = 'Entrar no Sistema';
        }
      } catch (err) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.innerHTML = '<strong>Erro de conexão:</strong> Não foi possível contatar o servidor.';
        alertDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerText = 'Entrar no Sistema';
      }
    });

    // Se já estiver logado, redireciona para index
    if (Auth.estaAutenticado()) {
      window.location.href = '/index.html';
    }
  </script>
</body>
</html>
